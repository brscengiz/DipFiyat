name: DipFiyat - Fiyat Takip Botu

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fiyat-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Fiyatları kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_tracker.py

      - name: Fiyat geçmişini repoya kaydet
        run: |
          git config user.name "dipfiyat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price_history.json
          git diff --staged --quiet || git commit -m "Fiyat geçmişi güncellendi [otomatik]"
          git push
